services:
  db:
    image: postgres:latest
    container_name: lobato_tours_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydatabase
    ports:
      - "5430:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

